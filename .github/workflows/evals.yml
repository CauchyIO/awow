name: evals

# Submitting an eval run is one authenticated API call against the night eval
# service; .github/actions/eval-run does it and waits for scores. Triggers: a
# manual button, and a gate run on PRs that touch the flows or the eval set.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Tier name (bulk | worker | flagship)
        default: worker
      reps:
        description: Repetitions per scenario
        default: "5"
  pull_request:
    types: [opened, synchronize]
    paths:
      - .agents/**
      - context/**
      - evals/**
      - .github/actions/eval-run/**
      - .github/workflows/evals.yml
      - AGENTS.md

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # Same-repo PRs and manual runs only — fork PRs never see the key.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate suite (static, zero tokens)
        run: python3 evals/validate.py

      - id: eval
        uses: ./.github/actions/eval-run
        with:
          api-key: ${{ secrets.AWOW_EVAL_API_KEY }}
          model: ${{ inputs.model || 'worker' }}
          seat-id: ${{ inputs.model || 'worker' }}
          eval-version: "1"
          enforce: "false"
          reps: ${{ inputs.reps || '5' }}

      - name: Upload compact scorecard
        if: always() && hashFiles('eval-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard-${{ github.run_id }}
          path: ${{ steps.eval.outputs.result-path }}
          if-no-files-found: error
