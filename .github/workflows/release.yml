name: release

# Cutting a release is the merge that bumps the version — nothing else. Between
# v0.6.0 and v0.8.0 publishing was a manual script nobody ran (AWO-156); tying
# it to a tag fixed the publish but left the tag manual, and v0.9.2's release
# sat as a draft with empty notes (AWO-261). Now a push to main whose canonical
# version has no GitHub release yet gets its awow-dist publish PR, its tag, and
# a published release whose body is that version's CHANGELOG.md section — the
# notes reviewed in the bump PR. Every other push to main is a no-op here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the changelog verify needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A draft counts as released here: v0.9.2's draft is a human's to publish
      # or delete, not this workflow's to clobber.
      - name: Is the canonical version released already?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already has a release — nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no release yet — cutting it from $GITHUB_SHA."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Verify before publishing anything. A payload that fails these must never
      # reach an install surface.
      - name: Generated surfaces in sync
        if: steps.gate.outputs.released == 'false'
        run: python3 tools/gather.py --check
      - name: Payload manifest integrity
        if: steps.gate.outputs.released == 'false'
        run: python3 tests/payload-manifests/test_manifest_integrity.py

      # The release body is the section the bump PR added and reviewed. Missing
      # or empty stops the release: CI on the PR checks the same thing, so this
      # only fires when someone bypassed it.
      - name: Extract the release body from CHANGELOG.md
        if: steps.gate.outputs.released == 'false'
        run: >
          python3 tools/release-notes.py
          --version "${{ steps.gate.outputs.version }}"
          --extract-from CHANGELOG.md --out RELEASE_NOTES.md

      # An installation token from cauchy-awow-publisher (app id 4557933), a
      # CauchyIO-owned App built for this one job, not a PAT: org-owned rather
      # than tied to a person, and expiring in an hour. It holds exactly
      # contents:write and pull_requests:write, the two the sync needs, and is
      # installed on selected repositories rather than all.
      #
      # Note the permission is wider than the flow: contents:write would allow
      # pushing straight to awow-dist's default branch. Publishing stays a PR
      # because sync-dist.sh chooses to open one, not because the token forbids
      # the alternative.
      - name: Mint an awow-dist installation token
        if: steps.gate.outputs.released == 'false'
        id: dist-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AWOW_APP_ID }}
          private-key: ${{ secrets.AWOW_APP_PRIVATE_KEY }}
          owner: CauchyIO
          repositories: awow-dist

      # sync-dist.sh commits inside a fresh clone of awow-dist, and that clone
      # carries no git identity: actions/checkout configures only the repo it
      # checks out, and a runner has no global config. v0.9.2 failed here with
      # "empty ident name". Set it in the workflow rather than the script, so a
      # human running sync-dist.sh by hand still authors as themselves. The
      # identity is the publisher App's bot, the same one whose token pushes.
      - name: Configure git identity for the publish commit
        if: steps.gate.outputs.released == 'false'
        run: |
          git config --global user.name "cauchy-awow-publisher[bot]"
          git config --global user.email "315785006+cauchy-awow-publisher[bot]@users.noreply.github.com"

      # sync-dist.sh opens a PR against awow-dist and never pushes to its base
      # branch, so merging stays a human act on a public repo. It runs before
      # the release is created: a failure here leaves no release behind, so the
      # next push to main (or a manual dispatch) simply cuts it again. Each run
      # opens a fresh timestamped PR, so close a stale one from a failed run.
      - name: Open the awow-dist publish PR
        if: steps.gate.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.dist-token.outputs.token }}
        run: |
          # The script authenticates three ways. `gh repo clone` and
          # `gh pr create` read GH_TOKEN, but the `git push` between them is
          # plain git, which does not: v0.9.2 failed there on "could not read
          # Username for 'https://github.com'". Locally a developer's credential
          # helper covers it; a runner has none. setup-git points git at gh, so
          # the push uses the same installation token as the other two.
          gh auth setup-git
          ./tools/sync-dist.sh --apply -y

      # --target makes gh create the tag at this commit, so the tag is a product
      # of the release rather than a step someone has to remember. Published,
      # not draft: the body was reviewed in the bump PR, and a draft nobody
      # publishes is a release nobody can see.
      - name: Create the tag and publish the release
        if: steps.gate.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.gate.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.gate.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
