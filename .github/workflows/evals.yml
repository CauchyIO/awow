name: evals

# Submitting an eval run IS pushing a tag — see evals/README.md for the whole
# pattern. This workflow is just two of this repo's triggers for doing that:
# a manual button, and a gate run on PRs that touch the flows or the eval set.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - eval-request.yaml
      - evals/**
      - commands/**

permissions:
  contents: write   # the request tag
  id-token: write   # OIDC proof for the doorbell — no stored secret anywhere

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    # Same-repo PRs and manual runs only — fork PRs never submit.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Submit — tag this commit as an eval request
        run: |
          sha=$(git rev-parse HEAD)
          id="$(date -u +%Y%m%d-%H%M%S)-${sha:0:7}"
          git tag "eval-request/$id" "$sha"
          git push origin "eval-request/$id"
          echo "submitted eval-request/$id — results will arrive as branch night/eval-$id" >> "$GITHUB_STEP_SUMMARY"

      - name: Ring — prove identity to Azure (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_EVAL_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_EVAL_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_EVAL_SUBSCRIPTION_ID }}

      - name: Ring — start the evaluator
        run: |
          # Retry covers the start racing the VM's self-park; a miss is healed
          # by the next doorbell — the tag is durable, nothing is lost.
          for i in 1 2 3 4 5 6; do
            az vm start -g "${{ vars.AZURE_EVAL_RG }}" -n "${{ vars.AZURE_EVAL_VM }}" && exit 0
            echo "start attempt $i failed (likely mid-deallocation) — retrying in 20s"
            sleep 20
          done
          echo "::error::evaluator did not start after 6 attempts; the request tag stays queued and the next submission drains it"
          exit 1
